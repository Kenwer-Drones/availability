databases:
  - name: availability-db
    plan: free
    databaseName: availability

services:
  - type: web
    name: team-availability
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker --bind 0.0.0.0:$PORT server:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: availability-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12"
