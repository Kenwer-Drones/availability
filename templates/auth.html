<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Kenwer Drones</title>
    <link rel="icon" href="/static/icon.png">
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; color: #172033; background: #f5f7fb; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
        .auth-shell { width: min(440px, 100%); }
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; font-size: 22px; font-weight: 700; }
        .brand img { width: 30px; height: 30px; }
        .card { background: #fff; border: 1px solid #e0e5ee; border-radius: 14px; padding: 28px; box-shadow: 0 12px 35px rgba(32, 48, 80, .08); }
        h1 { margin: 0 0 6px; font-size: 24px; }
        .muted { color: #657084; font-size: 13px; line-height: 1.45; }
        .tabs { display: flex; gap: 8px; margin: 22px 0; }
        button, input, select { font: inherit; }
        button { cursor: pointer; }
        .tab, .link-button { border: 0; background: transparent; color: #3367d6; padding: 8px 0; }
        .tab { border-bottom: 2px solid transparent; margin-right: 14px; color: #657084; }
        .tab.active { color: #2855b6; border-color: #3367d6; font-weight: 700; }
        label { display: block; margin: 13px 0; color: #4d586b; font-size: 13px; }
        input, select { display: block; width: 100%; margin-top: 6px; padding: 10px 11px; border: 1px solid #cfd6e3; border-radius: 8px; color: #172033; background: #fff; }
        input:focus, select:focus { outline: 2px solid #b8cdf8; border-color: #3367d6; }
        .primary { width: 100%; margin-top: 14px; padding: 11px; border: 0; border-radius: 8px; background: #3367d6; color: #fff; font-weight: 700; }
        .primary:hover { background: #2855b6; }
        .secondary { width: 100%; margin-top: 10px; padding: 10px; border: 1px solid #cfd6e3; border-radius: 8px; background: #fff; color: #39465d; }
        .error { min-height: 20px; margin: 12px 0 0; color: #b42318; font-size: 13px; }
        .success { color: #176b3a; }
        .question { padding: 10px 12px; border-radius: 8px; background: #f1f5ff; color: #294a91; font-size: 13px; }
        .back { display: inline-block; margin-top: 18px; color: #3367d6; text-decoration: none; font-size: 13px; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main class="auth-shell">
        <div class="brand"><img src="/static/icon.png" alt="">Team Availability</div>
        <section class="card">
            <h1 id="title">Sign in</h1>
            <p class="muted" id="subtitle">Use the same account for Availability and Tasks.</p>
            <div class="tabs" role="tablist" aria-label="Account action">
                <button class="tab active" id="login-tab" type="button">Sign in</button>
                <button class="tab" id="signup-tab" type="button">Create account</button>
            </div>
            <form id="auth-form">
                <div id="signup-fields" hidden>
                    <label>Your name<input id="name" maxlength="60" autocomplete="name"></label>
                </div>
                <label>Initials<input id="initials" required pattern="[A-Za-z]{2,3}" minlength="2" maxlength="3" autocomplete="username"></label>
                <label id="password-label">Password (at least 10 characters for signup)<input id="password" required type="password" maxlength="256" autocomplete="current-password"></label>
                <div id="signup-recovery" hidden>
                    <p class="question">What is your nickname?</p>
                    <label>Nickname answer<input id="security-answer" maxlength="256" autocomplete="off"></label>
                    <label>Your timezone<select id="timezone"></select></label>
                </div>
                <div id="reset-fields" hidden>
                    <p class="question" id="recovery-question"></p>
                    <label>Nickname answer<input id="reset-answer" maxlength="256" autocomplete="off"></label>
                    <label>New password<input id="new-password" type="password" minlength="10" maxlength="256" autocomplete="new-password"></label>
                </div>
                <button class="link-button" id="forgot" type="button">Forgot password?</button>
                <p class="error" id="message" role="alert"></p>
                <button class="primary" id="submit" type="submit">Sign in</button>
                <button class="secondary" id="cancel-recovery" type="button" hidden>Back to sign in</button>
            </form>
            <a class="back" href="/">← Back to Availability</a>
        </section>
    </main>
    <script src="/static/auth.js" defer></script>
</body>
</html>
