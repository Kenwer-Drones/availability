<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Team Availability</title>
    <link rel="icon" type="image/png" href="/static/icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: #fff;
            border-bottom: 1px solid #ddd;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #333;
        }

        header h1 svg {
            flex-shrink: 0;
        }

        .user-setup {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
        }

        .user-setup label {
            font-size: 13px;
            color: #666;
        }

        .user-setup input {
            width: 60px;
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
            text-transform: uppercase;
        }

        .user-setup input:disabled {
            background: #e8f5e9;
            border-color: #4caf50;
            color: #333;
            font-weight: 600;
        }

        .user-setup select {
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
        }

        .user-setup select option.tz-active {
            background: #e8f0fe;
            font-weight: 600;
        }

        .btn-lock {
            padding: 4px 10px;
            border: 1px solid #4caf50;
            background: #4caf50;
            color: #fff;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-lock:hover {
            background: #43a047;
        }

        .btn-reset {
            display: none;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .dates-panel {
            width: 140px;
            background: #fff;
            border-right: 1px solid #ddd;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .date-item {
            padding: 14px 14px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.15s;
        }

        .date-item:hover {
            background: #f0f0f0;
        }

        .date-item.active {
            background: #e8f0fe;
            font-weight: 600;
            border-left: 3px solid #4285f4;
        }

        .date-item .day-name {
            font-size: 12px;
            color: #888;
            margin-bottom: 3px;
        }

        .date-item .day-number {
            font-size: 17px;
        }

        .date-item.past {
            background: #fff3e0;
        }

        .date-item.past.active {
            background: #ffe0b2;
            border-left-color: #ff9800;
        }

        .date-item.today {
            background: #e8f5e9;
        }

        .date-item.today.active {
            background: #c8e6c9;
            border-left-color: #4caf50;
        }

        .date-item.future {
            background: #e3f2fd;
        }

        .date-item.future.active {
            background: #bbdefb;
            border-left-color: #2196f3;
        }

        .schedule-panel {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        .schedule-header {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-apply-week {
            font-size: 11px;
            font-weight: 500;
            padding: 4px 10px;
            border: 1px solid #4285f4;
            background: #fff;
            color: #4285f4;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-apply-week:hover {
            background: #e8f0fe;
        }

        .btn-apply-week:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-undo-week {
            font-size: 11px;
            font-weight: 500;
            padding: 4px 10px;
            border: 1px solid #f44336;
            background: #fff;
            color: #f44336;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
            display: none;
        }

        .btn-undo-week:hover {
            background: #ffebee;
        }

        .btn-undo-week:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-clear-day {
            font-size: 11px;
            font-weight: 500;
            padding: 4px 10px;
            border: 1px solid #ff9800;
            background: #fff;
            color: #ff9800;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-clear-day:hover {
            background: #fff3e0;
        }

        .btn-clear-day:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .schedule-tz-note {
            font-size: 12px;
            color: #888;
            margin-bottom: 16px;
        }

        .hours-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
        }

        .hour-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            transition: all 0.15s;
        }

        .hour-btn:hover {
            border-color: #4285f4;
            box-shadow: 0 2px 6px rgba(66, 133, 244, 0.15);
        }

        .hour-btn.selected {
            background: #e8f5e9;
            border-color: #4caf50;
        }

        .hour-btn.past-hour {
            background: #fff3e0;
            border-color: #ffe0b2;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .hour-btn.past-hour:hover {
            border-color: #ffe0b2;
            box-shadow: none;
        }

        .hour-btn .hour-label {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        .hour-btn .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            justify-content: center;
        }

        .initials-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #4285f4;
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            position: relative;
            cursor: pointer;
        }

        .initials-badge .badge-tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            font-size: 11px;
            font-weight: 400;
            white-space: nowrap;
            padding: 4px 8px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 50;
        }

        .initials-badge .badge-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 4px solid transparent;
            border-top-color: #333;
        }

        .initials-badge:hover .badge-tooltip,
        .initials-badge.show-tooltip .badge-tooltip {
            display: block;
        }

        .hour-btn .empty-hint {
            color: #bbb;
            font-size: 11px;
        }

        .summary-section {
            margin-top: 24px;
            border-top: 1px solid #ddd;
            padding-top: 16px;
        }

        .summary-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
        }

        .summary-person {
            margin-bottom: 10px;
            padding: 8px 12px;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 6px;
        }

        .summary-person-name {
            font-size: 13px;
            font-weight: 600;
            color: #4285f4;
            margin-bottom: 4px;
        }

        .summary-person-hours {
            font-size: 12px;
            color: #555;
            line-height: 1.5;
            font-weight: 600;
        }

        .status-bar {
            background: #fff;
            border-top: 1px solid #ddd;
            padding: 6px 20px;
            font-size: 11px;
            color: #888;
            flex-shrink: 0;
        }

        .status-bar .connected {
            color: #4caf50;
        }

        .status-bar .disconnected {
            color: #f44336;
        }

        .setup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .setup-box {
            background: #fff;
            border-radius: 10px;
            padding: 30px;
            min-width: 320px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .setup-box h2 {
            font-size: 18px;
            margin-bottom: 16px;
        }

        .setup-box label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 4px;
            margin-top: 12px;
        }

        .setup-box input, .setup-box select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .setup-box input {
            text-transform: uppercase;
        }

        .setup-box button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background: #4285f4;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .setup-box button:hover {
            background: #3367d6;
        }

        .setup-box .error {
            color: #f44336;
            font-size: 12px;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <header>
        <h1><img src="/static/icon.png" alt="logo" style="width:26px; height:26px;">Team Availability</h1>
        <div class="user-setup">
            <span id="user-display" style="font-size:13px; color:#333;"></span>
            <label for="tz-select">Timezone:</label>
            <select id="tz-select"></select>
            <button class="btn-reset" id="btn-reset-user" style="display:none;"></button>
        </div>
    </header>

    <div class="main-container">
        <div class="dates-panel" id="dates-panel"></div>
        <div class="schedule-panel" id="schedule-panel">
            <p style="color:#aaa; font-size:13px;">Select a date to view/edit availability</p>
        </div>
    </div>

    <div class="status-bar">
        <span id="connection-status" class="disconnected">Connecting...</span>
    </div>

    <div class="setup-overlay" id="setup-overlay" style="display:none;">
        <div class="setup-box">
            <h2>Welcome! Set up your profile</h2>
            <label for="setup-name">Your Name</label>
            <input type="text" id="setup-name" maxlength="30" placeholder="John Doe" style="text-transform:none;">
            <label for="setup-initials">Your Initials (2-3 letters)</label>
            <input type="text" id="setup-initials" maxlength="3" placeholder="JD">
            <label for="setup-tz">Your Timezone</label>
            <select id="setup-tz"></select>
            <div class="error" id="setup-error"></div>
            <button id="setup-confirm">Confirm</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        const socket = io();
        let currentDate = null;
        let slotsCache = {};
        const STANDARD_TIMEZONE = 'America/Phoenix';

        const USER_COLORS = ['#e74c3c', '#3498db', '#f39c12', '#9b59b6', '#1abc9c', '#e91e63', '#00bcd4', '#ff5722', '#673ab7', '#009688', '#795548', '#607d8b', '#c2185b', '#d84315', '#7b1fa2', '#00897b', '#f57c00', '#5c6bc0', '#ef5350', '#26a69a'];
        const userColorAssignments = {};
        let colorIndex = 0;

        function getColorForUser(initials) {
            if (userColorAssignments[initials]) return userColorAssignments[initials];
            userColorAssignments[initials] = USER_COLORS[colorIndex % USER_COLORS.length];
            colorIndex++;
            return userColorAssignments[initials];
        }

        function assignColorsFromCache() {
            const allInitials = new Set();
            for (const people of Object.values(slotsCache)) {
                for (const p of people) {
                    allInitials.add(p.initials);
                }
            }
            [...allInitials].sort().forEach(initials => getColorForUser(initials));
        }

        const TIMEZONES = [
            { value: 'Pacific/Midway', label: '(UTC-11:00) Samoa' },
            { value: 'Pacific/Honolulu', label: '(UTC-10:00) Hawaii' },
            { value: 'Pacific/Marquesas', label: '(UTC-09:30) Marquesas Islands' },
            { value: 'America/Anchorage', label: '(UTC-09:00) Alaska' },
            { value: 'America/Los_Angeles', label: '(UTC-08:00) US/Canada Pacific' },

            { value: 'America/Mexico_City', label: '(UTC-06:00) Mexico' },

            { value: 'America/Bogota', label: '(UTC-05:00) Colombia' },
            { value: 'America/Lima', label: '(UTC-05:00) Peru' },
            { value: 'America/Caracas', label: '(UTC-04:00) Venezuela' },

            { value: 'UTC', label: '(UTC+00:00) UTC / GMT' },

            { value: 'Europe/Warsaw', label: '(UTC+01:00) Poland' },
            { value: 'Africa/Cairo', label: '(UTC+02:00) Egypt' },
            { value: 'Africa/Johannesburg', label: '(UTC+02:00) South Africa' },
            { value: 'Europe/Athens', label: '(UTC+02:00) Greece' },

            { value: 'Europe/Moscow', label: '(UTC+03:00) Russia (Moscow)' },
            { value: 'Asia/Riyadh', label: '(UTC+03:00) Saudi Arabia' },

            { value: 'Asia/Colombo', label: '(UTC+05:30) Sri Lanka' },
            { value: 'Asia/Kathmandu', label: '(UTC+05:45) Nepal' },
            { value: 'Asia/Dhaka', label: '(UTC+06:00) Bangladesh' },

            { value: 'Asia/Ho_Chi_Minh', label: '(UTC+07:00) Vietnam' },

            { value: 'Asia/Singapore', label: '(UTC+08:00) Singapore' },
            { value: 'Asia/Kuala_Lumpur', label: '(UTC+08:00) Malaysia' },
            { value: 'Asia/Manila', label: '(UTC+08:00) Philippines' },
            { value: 'Asia/Taipei', label: '(UTC+08:00) Taiwan' },
            { value: 'Australia/Perth', label: '(UTC+08:00) Australia (West)' },
            { value: 'Asia/Tokyo', label: '(UTC+09:00) Japan' },
            { value: 'Asia/Seoul', label: '(UTC+09:00) South Korea' },
            { value: 'Australia/Darwin', label: '(UTC+09:30) Australia (Central)' },
            { value: 'Australia/Sydney', label: '(UTC+10:00) Australia (East)' },
            { value: 'Pacific/Guam', label: '(UTC+10:00) Guam' },
            { value: 'Pacific/Noumea', label: '(UTC+11:00) New Caledonia' },
            { value: 'Pacific/Auckland', label: '(UTC+12:00) New Zealand' },
            { value: 'Pacific/Fiji', label: '(UTC+12:00) Fiji' },
            { value: 'Pacific/Tongatapu', label: '(UTC+13:00) Tonga' }
        ];

        function getUserTimezone() { return localStorage.getItem('userTimezone') || 'America/Phoenix'; }
        function setUserTimezone(tz) { localStorage.setItem('userTimezone', tz); }

        function getZonedParts(date, tz) {
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: tz,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: 'numeric',
                hour12: false,
                minute: 'numeric'
            }).formatToParts(date);
            let year, month, day, hour, minute;
            parts.forEach(p => {
                if (p.type === 'year') year = p.value;
                if (p.type === 'month') month = p.value;
                if (p.type === 'day') day = p.value;
                if (p.type === 'hour') hour = parseInt(p.value);
                if (p.type === 'minute') minute = parseInt(p.value);
            });
            if (hour === 24) hour = 0;
            return { date: `${year}-${month}-${day}`, hour, minute };
        }

        function zonedTimeToUTC(dateStr, hour, minute, tz) {
            const approx = new Date(`${dateStr}T${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}:00Z`);
            for (let offsetMinutes = -14 * 60; offsetMinutes <= 14 * 60; offsetMinutes += 30) {
                const candidateUTC = new Date(approx.getTime() + offsetMinutes * 60000);
                const local = getZonedParts(candidateUTC, tz);
                if (local.date === dateStr && local.hour === hour && local.minute === minute) {
                    return {
                        date_utc: candidateUTC.toISOString().slice(0, 10),
                        hour_utc: candidateUTC.getUTCHours()
                    };
                }
            }
            return { date_utc: dateStr, hour_utc: hour };
        }

        function standardSlotToUTC(standardDateStr, standardHour) {
            return zonedTimeToUTC(standardDateStr, standardHour, 0, STANDARD_TIMEZONE);
        }

        function getStandardNow() {
            return getZonedParts(new Date(), STANDARD_TIMEZONE);
        }

        function getPeopleForStandardSlot(standardDateStr, standardHour) {
            const utc = standardSlotToUTC(standardDateStr, standardHour);
            return slotsCache[`${utc.date_utc}_${utc.hour_utc}`] || [];
        }

        function formatTimeInTimezone(date, tz) {
            return date.toLocaleTimeString('en-US', {
                timeZone: tz,
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
        }

        function formatStandardSlotRange(standardDateStr, standardHour) {
            const tz = getUserTimezone();
            const utc = standardSlotToUTC(standardDateStr, standardHour);
            const start = new Date(`${utc.date_utc}T${String(utc.hour_utc).padStart(2,'0')}:00:00Z`);
            const end = new Date(start.getTime() + 60 * 60000);
            return `${formatTimeInTimezone(start, tz)} - ${formatTimeInTimezone(end, tz)}`;
        }

        function getInitials() { return localStorage.getItem('userInitials') || ''; }
        function getUserName() { return localStorage.getItem('userName') || ''; }
        function isInitialsLocked() { return localStorage.getItem('initialsLocked') === 'true'; }
        function lockInitials(initials, name) {
            localStorage.setItem('userInitials', initials);
            localStorage.setItem('userName', name);
            localStorage.setItem('initialsLocked', 'true');
        }
        function resetUser() {
            if (confirm('This will clear your profile. You will need to set up again. Continue?')) {
                localStorage.removeItem('userInitials');
                localStorage.removeItem('userName');
                localStorage.removeItem('initialsLocked');
                location.reload();
            }
        }

        function populateTimezoneSelect(selectEl, selectedValue) {
            selectEl.innerHTML = TIMEZONES.map(tz => `<option value="${tz.value}" ${tz.value === selectedValue ? 'selected' : ''}>${tz.label}</option>`).join('');
        }

        function showSetupIfNeeded() {
            if (isInitialsLocked()) {
                document.getElementById('setup-overlay').style.display = 'none';
                document.getElementById('user-display').textContent = `Logged in as: ${getUserName()} (${getInitials()})`;
                document.getElementById('btn-reset-user').style.display = 'inline-block';
                return;
            }
            document.getElementById('setup-overlay').style.display = 'flex';
            const setupTz = document.getElementById('setup-tz');
            const detectedTz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Phoenix';
            populateTimezoneSelect(setupTz, detectedTz);
        }

        document.getElementById('setup-confirm').addEventListener('click', () => {
            const name = document.getElementById('setup-name').value.trim();
            const initials = document.getElementById('setup-initials').value.toUpperCase().replace(/[^A-Z]/g, '');
            const tz = document.getElementById('setup-tz').value;
            const errorEl = document.getElementById('setup-error');
            if (!name) { errorEl.textContent = 'Please enter your name.'; return; }
            if (initials.length < 2) { errorEl.textContent = 'Please enter at least 2 letters for your initials.'; return; }
            lockInitials(initials, name);
            setUserTimezone(tz);
            document.getElementById('setup-overlay').style.display = 'none';
            document.getElementById('user-display').textContent = `Logged in as: ${name} (${initials})`;
            document.getElementById('btn-reset-user').style.display = 'inline-block';
            const tzSelect = document.getElementById('tz-select');
            tzSelect.value = tz;
            registerTimezone(initials, name, tz);
            renderDatesPanel();
        });

        document.getElementById('btn-reset-user').addEventListener('click', resetUser);

        const tzSelect = document.getElementById('tz-select');
        populateTimezoneSelect(tzSelect, getUserTimezone());
        tzSelect.addEventListener('change', () => {
            setUserTimezone(tzSelect.value);
            if (isInitialsLocked()) { registerTimezone(getInitials(), getUserName(), tzSelect.value); }
            renderDatesPanel();
            if (currentDate) { renderSchedule(currentDate); }
        });

        function formatDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getLocalNow() {
            return getStandardNow();
        }

        function getDayName(dateStr) { return new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short' }); }
        function getMonthDay(dateStr) { return new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }

        function getDateClass(dateStr) {
            const localNow = getLocalNow();
            if (dateStr === localNow.date) return 'today';
            if (dateStr < localNow.date) return 'past';
            return 'future';
        }

        function generateDates() {
            const dates = [];
            const localNow = getLocalNow();
            const base = new Date(localNow.date + 'T12:00:00');
            for (let i = -7; i < 83; i++) {
                const d = new Date(base);
                d.setDate(d.getDate() + i);
                dates.push(formatDate(d));
            }
            return dates;
        }

        function renderDatesPanel() {
            const panel = document.getElementById('dates-panel');
            const dates = generateDates();
            panel.innerHTML = dates.map(dateStr => {
                const dateClass = getDateClass(dateStr);
                const activeClass = currentDate === dateStr ? ' active' : '';
                return `<div class="date-item ${dateClass}${activeClass}" data-date="${dateStr}"><div class="day-name">${getDayName(dateStr)}</div><div class="day-number">${getMonthDay(dateStr)}</div></div>`;
            }).join('');
            panel.querySelectorAll('.date-item').forEach(el => {
                el.addEventListener('click', () => selectDate(el.dataset.date));
            });
            if (!currentDate) { selectDate(getLocalNow().date); }
        }

        function selectDate(dateStr) {
            currentDate = dateStr;
            document.querySelectorAll('.date-item').forEach(el => {
                el.classList.toggle('active', el.dataset.date === dateStr);
            });
            fetchSlots(dateStr);
        }

        async function fetchSlots(dateStr) {
            try {
                const res = await fetch('/api/slots');
                const data = await res.json();
                slotsCache = data;
                assignColorsFromCache();
                renderSchedule(dateStr);
            } catch (err) {
                console.error('Failed to fetch slots:', err);
            }
        }

        function isHourPast(localDateStr, localHour) {
            const localNow = getLocalNow();
            if (localDateStr < localNow.date) return true;
            if (localDateStr === localNow.date && localHour < localNow.hour) return true;
            return false;
        }

        function renderSchedule(localDateStr) {
            const panel = document.getElementById('schedule-panel');
            const d = new Date(localDateStr + 'T12:00:00');
            const headerText = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
            const tz = getUserTimezone();

            let html = `<div class="schedule-header"><span>${headerText}</span><button class="btn-apply-week" id="btn-apply-week">Apply to whole week</button><button class="btn-undo-week" id="btn-undo-week">Undo week</button><button class="btn-clear-day" id="btn-clear-day">Clear day</button></div>`;
            html += `<div class="schedule-tz-note">Arizona time is the standard. Times shown in: ${tz}</div>`;
            html += `<div class="hours-grid">`;

            const peopleSummary = {};
            const userInitials = getInitials();

            for (let h = 0; h < 24; h++) {
                const label = formatStandardSlotRange(localDateStr, h);
                const people = getPeopleForStandardSlot(localDateStr, h);
                const isSelected = people.some(p => p.initials === userInitials);
                const pastHour = isHourPast(localDateStr, h);

                people.forEach(p => {
                    if (!peopleSummary[p.initials]) peopleSummary[p.initials] = { name: p.name, count: 0 };
                    peopleSummary[p.initials].count++;
                });

                const badges = people.map(p => {
                    const color = getColorForUser(p.initials);
                    const displayName = p.name || p.initials;
                    return `<span class="initials-badge" style="background:${color}" data-name="${displayName}">${p.initials}<span class="badge-tooltip">${displayName}</span></span>`;
                }).join('');

                const classes = ['hour-btn'];
                if (isSelected) classes.push('selected');
                if (pastHour) classes.push('past-hour');

                const contentHtml = badges.length > 0 ? `<div class="badges">${badges}</div>` : `<div class="empty-hint">No one</div>`;

                html += `<button class="${classes.join(' ')}" data-hour="${h}" data-standard-date="${localDateStr}" ${pastHour ? 'disabled' : ''}><div class="hour-label">${label}</div>${contentHtml}</button>`;
            }

            html += `</div>`;

            if (Object.keys(peopleSummary).length > 0) {
                html += `<div class="summary-section"><div class="summary-title">Availability Summary</div>`;
                Object.keys(peopleSummary).sort().forEach(initials => {
                    const info = peopleSummary[initials];
                    html += `<div class="summary-person"><div class="summary-person-name">${info.name} (${initials})</div><div class="summary-person-hours">${info.count} / 7 hours</div></div>`;
                });
                html += `</div>`;
            }

            panel.innerHTML = html;

            panel.querySelectorAll('.hour-btn:not(:disabled)').forEach(btn => {
                btn.addEventListener('click', () => toggleSlot(btn.dataset.hour, btn.dataset.standardDate));
            });

            const clearBtn = document.getElementById('btn-clear-day');
            if (clearBtn) clearBtn.addEventListener('click', () => clearDay(localDateStr));
        }

        function toggleSlot(hour, standardDateStr) {
            const utc = standardSlotToUTC(standardDateStr, parseInt(hour));
            fetch('/api/slots', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    date_utc: utc.date_utc,
                    hour_utc: utc.hour_utc,
                    initials: getInitials(),
                    name: getUserName()
                })
            }).then(res => res.json()).then(data => { fetchSlots(standardDateStr); }).catch(err => console.error('Toggle slot error:', err));
        }

        function registerTimezone(initials, name, tz) {
            fetch('/api/timezones', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ initials, name, timezone: tz })
            }).catch(err => console.error('Register timezone error:', err));
        }

        function clearDay(standardDateStr) {
            if (!confirm('Clear all your availability for this Arizona day?')) return;
            const userInitials = getInitials();
            for (let h = 0; h < 24; h++) {
                const people = getPeopleForStandardSlot(standardDateStr, h);
                if (people.some(p => p.initials === userInitials)) {
                    const utc = standardSlotToUTC(standardDateStr, h);
                    fetch('/api/slots', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            date_utc: utc.date_utc,
                            hour_utc: utc.hour_utc,
                            initials: userInitials,
                            name: getUserName()
                        })
                    }).catch(err => console.error('Clear day error:', err));
                }
            }
            setTimeout(() => fetchSlots(standardDateStr), 500);
        }

        socket.on('connect', () => {
            console.log('Connected to server');
            document.getElementById('connection-status').textContent = 'Connected';
            document.getElementById('connection-status').className = 'connected';
        });

        socket.on('disconnect', () => {
            console.log('Disconnected from server');
            document.getElementById('connection-status').textContent = 'Disconnected';
            document.getElementById('connection-status').className = 'disconnected';
        });

        socket.on('slot_update', (data) => {
            console.log('Slot update:', data);
            if (currentDate) { fetchSlots(currentDate); }
        });

        socket.on('tz_update', (timezones) => {
            console.log('Timezone update:', timezones);
        });

        // INITIALIZATION
        showSetupIfNeeded();
        populateTimezoneSelect(tzSelect, getUserTimezone());
        if (isInitialsLocked()) {
            renderDatesPanel();
        }
    </script>
</body>
</html>
